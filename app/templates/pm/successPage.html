<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jobsite Created</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon.ico') }}" type="image/x-icon"/>

  <!-- CSS -->
 
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/successStyle.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">

  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}" async defer></script>
</head>

<body>
     <!-- Top Bar with Profile Picture -->
     <div id="top-bar" class="top-bar">
      <div class="top-bar-title">Jobsite Creation Successful</div>
      <a href="/profile">
          <img id="currentPfp"
               src="{{ url_for('routes.get_profile_picture', user_id=session['user']['UUID']) }}"
               alt="Profile Picture"
               class="profile-icon">
      </a>
  </div>

  <!-- Sidebar Navigation -->
  <div id="sidebar" class="sidebar">
      <button id="toggleSidebar" class="toggle-btn">☰</button>
      <div class="logo-container">
          <a href="https://www.starrelectric.net/" target="_blank">
              <img src="{{ url_for('static', filename='assets/starrwhitelogo.png') }}" alt="Starr Electric Logo">
          </a>
      </div>
      <div class="sidebar-content">
          <h2>Navigation</h2>
          <ul>
              <li><a href="/pmLandingPage">Home</a></li>
              <li><a href="/pmMainPage">Add New Jobsite</a></li>
              <li><a href="/assignUsers">Manage</a></li>
              <li><a href="/timeCards">TimeCards</a></li>
              <li><a href="/pmhelp">Help</a></li> 

          </ul>
          <form action="/logoutButtonClicked" method="POST" onsubmit="return confirmLogout()">
              <button type="submit" class="logout-button">Logout</button>
          </form>
      </div>
  </div>


  <!-- Main Content -->
  <div class="content">
    <div id="map"></div>
  </div>

  <!-- JavaScript -->
  <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pm/successPage.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
<script src="{{ url_for('static', filename='js/pm/successPage.js') }}"></script>
<script src="static/js/sidebar.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const proxyBtn = document.getElementById("fixedToggleBtn");
    const originalBtn = document.getElementById("toggleSidebar"); // created by sidebar.js

    if (proxyBtn && originalBtn) {
      proxyBtn.addEventListener("click", () => {
        originalBtn.click(); // triggers sidebar toggle via original event listener
      });
    }
  });
</script>
</body>
</html>
