<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeCards</title>
  <link rel="stylesheet" href="static/css/sidebar.css">
  <link rel="stylesheet" href="static/css/timeCard.css">
  <script src="static/js/sidebar.js"></script>
  <script src="static/js/pm/timeCards.js" defer></script>
</head>

<body>
<!-- Sidebar Navigation -->
<div id="sidebar" class="sidebar">
  <button id="toggleSidebar" class="toggle-btn">☰</button> <!-- Sidebar Toggle Button -->
    <!-- Starr Electric Logo -->
<div class="logo-container">
  <a href="https://www.starrelectric.net/" target="_blank">
    <img src="static/assets/starrwhitelogo.png" alt="Starr Electric Logo">
  </a>
</div>
  <div class="sidebar-content">
    <h2>Navigation</h2>
    <ul>
      <li><a href="/pmLandingPage">Home</a></li>
      <li><a href="/pmMainPage">Add New Jobsite</a></li>
      <li><a href="/assignUsers">Manage</a></li>
      <li><a href="/timeCards">TimeCards</a></li> 
      <li><a href="/pmhelp">Help</a></li>

    </ul>
    
    <!-- Logout Button inside the Sidebar -->
    <form action="/logoutButtonClicked" method="POST" onsubmit="return confirmLogout()">
      <button type="submit" class="logout-button">Logout</button>
    </form>
  </div>
</div>

  <!-- Content Wrapper -->
  <div id="cards-container">
    <h1>TimeCards</h1>
    <div class="form-container">
      <label for="workerSelect">Select Worker:</label>
      <select id="workerSelect">
        <!-- Dynamically populated -->
      </select>
      <label for="dateSelect">Select Date:</label>
      <input type="date" id="dateSelect">
      <button id="viewTimeCardButton">View TimeCard</button>
    </div>
    <div id="timeCardResults">
      <!-- TimeCard results will be displayed here -->
    </div>
  </div>
</body>

</html>
