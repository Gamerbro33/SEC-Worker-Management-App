<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove User to Jobsite</title>
    <link rel="stylesheet" href="static/css/workerManagementStyle.css"> <!-- Corrected CSS path -->
    <link rel="icon" href="static/assets/favicon.ico" type="image/x-icon"/>
    <script src="static/js/pm/removeWorker.js" defer></script> <!-- Ensure script loads after DOM -->
    <script src="static/js/sidebar.js"></script>
    
    <link rel="stylesheet" href="static/css/sidebar.css">
</head>
<body>
    <!-- Starr Electric Logo -->
    <div class="logo-container">
        <a href="https://www.starrelectric.net/" target="_blank">
            <img src="static/assets/starrwhitelogo.png" alt="Starr Electric Logo">
        </a>
    </div>
     <!-- Sidebar Navigation -->
   <div id="sidebar" class="sidebar">
    <button id="toggleSidebar" class="toggle-btn">☰</button> <!-- Sidebar Toggle Button -->
      <!-- Starr Electric Logo -->
  <div class="logo-container">
    <a href="https://www.starrelectric.net/" target="_blank">
      <img src="static/assets/starrwhitelogo.png" alt="Starr Electric Logo">
    </a>
  </div>
    <div class="sidebar-content">
      <h2>Navigation</h2>
      <ul>
        <li><a href="/pmLandingPage">Home</a></li>
        <li><a href="/pmMainPage">Add New Jobsite</a></li>
        <li><a href="/assignUsers">Manage</a></li>
        <li><a href="/timeCards">TimeCards</a></li> 
        <li><a href="/pmhelp">Help</a></li>

      </ul>
      
      <!-- Logout Button inside the Sidebar -->
      <form action="/logoutButtonClicked" method="POST" onsubmit="return confirmLogout()">
        <button type="submit" class="logout-button">Logout</button>
      </form>
    </div>
  </div>

    <div class="split-container">
        <div class="left-panel"> <!-- Renamed from 'left-side' -->
            <div class="form-container active" id="assign-container"> <!-- Renamed from 'container' -->
                <h1>Remove User From Jobsite</h1>
                <form id="removeUserForm">
                    <h4>Select User:</h4>
                    <select id="userSelect" name="userUUID" required onchange="fillAssignJobsites(this)">
                        <option value="default blank" selected>Please select a user</option>
                        <!-- Options populated by JavaScript -->
                    </select>
                    <h4>Select Jobsite:</h4>
                    <select id="jobsiteSelect" name="jobsiteUUID" required>
                        <!-- Options populated by JavaScript -->
                    </select>
                    <button type="submit" id="assignButton" onclick="removeAssignedUser()">Remove User</button>
                </form>
                <div id="resultMessage"></div>
                <h3>
                    <u onclick="window.location.href='/assignUsers'" style="cursor: pointer;">Assign to Jobsites</u>
                </h3>
                
            </div>
        </div>
        <div class="right-panel"></div> <!-- Renamed from 'right-side' -->
    </div>
</body>
</html>
