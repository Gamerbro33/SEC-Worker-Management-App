<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign User to Jobsite</title>
    <link rel="stylesheet" href="static/css/sidebar.css"> <!-- Ensure sidebar CSS is loaded first -->
    <link rel="stylesheet" href="static/css/workerManagementStyle.css"> <!-- Corrected CSS path -->
    <link rel="icon" href="static/assets/favicon.ico" type="image/x-icon"/>
    <script src="static/js/pm/manageWorkers.js" defer></script> <!-- Ensure script loads after DOM -->
    <script src="static/js/sidebar.js"></script>
</head>
<body>
    <!-- Top Bar with Profile Picture -->
    <div id="top-bar" class="top-bar">
      <a href="/profile">
          <img id="currentPfp"
               src="{{ url_for('routes.get_profile_picture', user_id=session['user']['UUID']) }}"
               alt="Profile Picture"
               class="profile-icon">
      </a>
  </div>

    <!-- Sidebar Navigation -->
    <div id="sidebar" class="sidebar">
        <button id="toggleSidebar" class="toggle-btn">☰</button> <!-- Sidebar Toggle Button -->
        <!-- Starr Electric Logo -->
        <div class="logo-container">
            <a href="https://www.starrelectric.net/" target="_blank">
                <img src="static/assets/starrwhitelogo.png" alt="Starr Electric Logo">
            </a>
        </div>
        <div class="sidebar-content">
            <h2>Navigation</h2>
            <ul>
                <li><a href="/pmLandingPage">Home</a></li>
                <li><a href="/pmMainPage">Add New Jobsite</a></li>
                <li><a href="/assignUsers">Manage</a></li>
                <li><a href="/timeCards">TimeCards</a></li>
                <li><a href="/pmhelp">Help</a></li>

            </ul>
            <!-- Logout Button inside the Sidebar -->
            <form action="/logoutButtonClicked" method="POST" onsubmit="return confirmLogout()">
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </div>
    </div>

    <div class="form-container" id="table"> <!-- Renamed from 'container' -->
        <div id="user-column"></div>
        <div id="jobsite-column">
            <h2>Click a user to manage them</h2>
        </div>
    </div>
</body>
</html>
